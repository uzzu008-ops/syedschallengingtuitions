<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
html{scroll-behavior:smooth}
body{background:#f4f4f4}

/* NAV */
nav{
 background:#fff;
 padding:14px 30px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 box-shadow:0 3px 10px rgba(0,0,0,.1);
 position:sticky;
 top:0;
 z-index:1000
}
nav img{height:50px}
nav a{text-decoration:none;margin-left:20px;color:#111;font-weight:600}

/* HEADER */
header{
 background:#8b1c1c;
 color:#fff;
 text-align:center;
 padding:40px 20px
}
header img{
 width:140px;
 background:#fff;
 padding:10px;
 border-radius:12px
}
header h1{margin-top:10px}
header p{opacity:.9}

/* NOTICE */
.notice{
 background:#ffeb3b;
 padding:12px;
 font-weight:600
}

/* SECTION */
.section{
 background:#fff;
 margin:25px auto;
 padding:30px;
 max-width:1100px;
 border-radius:16px;
 box-shadow:0 6px 15px rgba(0,0,0,.1)
}
.section h2{
 text-align:center;
 color:#8b1c1c;
 margin-bottom:18px
}
.section p.desc{
 text-align:center;
 color:#555;
 margin-bottom:20px
}

/* SLIDERS */
.slider{overflow:hidden}
.slider-track{display:flex;transition:.6s ease}
.slider img{
 width:100%;
 height:360px;
 object-fit:contain;
 background:#fff;
 flex-shrink:0;
 border-radius:14px
}
@media(max-width:768px){
 .slider img{height:220px}
}

/* FLOATING BUTTONS */
.floating{
 position:fixed;
 right:18px;
 bottom:18px;
 display:flex;
 flex-direction:column;
 gap:14px;
 z-index:9999
}
.floating a{
 width:56px;height:56px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#fff;
 font-size:26px;
 box-shadow:0 6px 16px rgba(0,0,0,.3)
}
.call{background:#1976d2}
.whatsapp{background:#25D366}
.instagram{
 background:radial-gradient(circle at 30% 110%,
 #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%)
}

footer{
 background:#8b1c1c;
 color:#fff;

</style>

<body>

<nav>

<div class="floating">
<a class="call" href="tel:8660202093"><i class="fa fa-phone"></i></a>
<a class="whatsapp" href="https://wa.me/918660202093"><i class="fab fa-whatsapp"></i></a>

<a class="instagram" 
   href="https://www.instagram.com/syeds_tutions/" 
   target="_blank">
   <i class="fab fa-instagram"></i>
</a>
</div>

<script>

/* ✅ FIXED NOTICE FETCH */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vT9-v1cam9L1DaRbBrdoT-VzJvsJtWy6_aUH_lrna3KA3FMG2kd9C4DscxEqjTpMtnz3WzIxh5xp4TE/pub?output=csv")
.then(r=>r.text())
.then(t=>{
 let rows = t.split("\n")
  .map(r=>r.replace(/\r/g,'').trim())
  .filter(r=>r.length>0);

 noticeText.innerText = rows.slice(1).join("  |  ");
})
.catch(()=>{
 noticeText.innerText="Admissions Open 2026";
});

/* KEEP YOUR ORIGINAL SLIDER */
function autoSlider(id,delay){
 const t=document.querySelector(`#${id} .slider-track`);
 let i=0;
 setInterval(()=>{
  i=(i+1)%t.children.length;
  t.style.transform=`translateX(-${i*100}%)`;
 },delay);
}

autoSlider("classSlider",3000);
autoSlider("resultSlider",3500);

</script>

</body>
